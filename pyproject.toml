[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "selfrag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings[yaml]>=2.4",
    "qdrant-client>=1.12,<1.13",
    "fastembed>=0.4",
    "sentence-transformers>=3.0",
    "asyncpg>=0.29",
    "pypdf>=4.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "python-docx>=1.1",
    "google-genai>=1.0",
    "groq>=0.11",
    "httpx>=0.27",
    "langgraph>=0.2",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9", "pyjwt>=2.8"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["selfrag*"]

[tool.setuptools.package-data]
"*" = ["prompts/*.txt", "*.yaml"]

[tool.pytest.ini_options]
testpaths = ["selfrag/tests"]
